[project]
name = "molecular-communication-simulator"
version = "0.1.0"
description = "Plot molecular communication simulation results."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<4",
]

[project.scripts]
plot-results = "scripts.plot_results:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
